name: Build Dashboard

on:
  push:
    paths:
      - 'FitNotesWorkouts.csv'
      - 'dashboard_template.html'
      - 'build_dashboard.py'
      - '.github/workflows/**'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Verify CSV export
        run: |
          if git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            python check_export.py HEAD~1
          fi

      - name: Build index.html
        run: |
          python build_dashboard.py

      - name: Commit and push generated dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "Keine Änderungen in index.html vorhanden."
          else
            git commit -m "Dashboard automatisch neu gebaut [skip ci]"
            git push
          fi
